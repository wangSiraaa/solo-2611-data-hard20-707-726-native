[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gradaudit"
version = "1.0.0"
description = "Independent course-equivalence catalog and graduation requirement audit library"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "gradaudit contributors"}]

[project.scripts]
gradaudit = "gradaudit.cli:main"

[tool.setuptools]
packages = ["gradaudit"]
